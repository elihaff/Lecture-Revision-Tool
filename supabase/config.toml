# A string used to distinguish different Supabase projects on the same host. Defaults to the working directory name when running `supabase init`.
project_id = "lecture-revision-tool"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = [
  "http://localhost:5174",
  "http://127.0.0.1:5174",
  "http://localhost:5174/*",
  "http://127.0.0.1:5174/*"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.generate-flashcards]
verify_jwt = false

[functions.generate-notes]
verify_jwt = false

[functions.generate-interpretation]
verify_jwt = false

[functions.process-lecture]
verify_jwt = false

[functions.suggest-flashcard-tags]
verify_jwt = false

[functions.generate-occlusion-explanations]
verify_jwt = false

[functions.convert-legacy-notes]
verify_jwt = false
